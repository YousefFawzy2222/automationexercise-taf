name: E2e Regression

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: '00 23 * * *'

  workflow_dispatch:

env:
  TARGET: "%regex[.*Tests.*],com.automationexercise.tests.**.**,com.automationexercise.tests.**"

jobs:
  Edge_Linux_Test:
    runs-on: ubuntu-latest

    permissions:
      checks: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.14

      - name: Prepare Download Directory
        run: mkdir -p src/test/resources/downloads

      - name: Running Tests
        id: linux_tests
        continue-on-error: true
        run: mvn clean test -Dtest="${TARGET}" -DexecutionType="LocalHeadless"

      - name: Show Test Output Files
        if: always()
        run: |
          pwd
          find test-output -maxdepth 5 -type f || true
          echo "Downloaded files:"
          find src/test/resources/downloads -maxdepth 2 -type f || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Edge_Linux_Report
          path: |
            test-output/reports/*.html
            test-output/full-report/**
            test-output/allure-results/**
            test-output/target/surefire-reports/**
            src/test/resources/downloads/**
          if-no-files-found: warn

      - name: Fail Job If Tests Failed
        if: steps.linux_tests.outcome == 'failure'
        run: exit 1

  Edge_Windows_Test:
    runs-on: windows-latest

    permissions:
      checks: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.14

      - name: Prepare Download Directory
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path src/test/resources/downloads

      - name: Running Tests
        id: windows_tests
        continue-on-error: true
        shell: powershell
        run: mvn clean test -Dtest="${env:TARGET}" -DexecutionType="LocalHeadless"

      - name: Show Test Output Files
        if: always()
        shell: powershell
        run: |
          Get-Location
          Get-ChildItem -Path test-output -Recurse -File -ErrorAction SilentlyContinue
          Write-Host "Downloaded files:"
          Get-ChildItem -Path src/test/resources/downloads -Recurse -File -ErrorAction SilentlyContinue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Edge_Windows_Report
          path: |
            test-output/reports/*.html
            test-output/full-report/**
            test-output/allure-results/**
            test-output/target/surefire-reports/**
            src/test/resources/downloads/**
          if-no-files-found: warn

      - name: Fail Job If Tests Failed
        if: steps.windows_tests.outcome == 'failure'
        shell: powershell
        run: exit 1